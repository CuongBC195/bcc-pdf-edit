name: Build Windows Raycast Launcher (.exe)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate Tauri icon from SVG
        run: npx @tauri-apps/cli@2 icon public/bcc-logo.svg

      - name: Build Windows Installer (.exe / .msi)
        run: npx @tauri-apps/cli@2 build

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bccHub-Windows-Launcher-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
